<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>魔女试炼 / Witch Trial</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hint">电脑: ↑↓ 切轨 / Enter · 手机: 上滑切上轨 / 下滑切下轨（全屏任意位置）· 菜单商城可直接点</div>
  </div>
  <div id="fsBtn" title="全屏">⛶</div>
  <script>
    // 全屏支持：点击按钮进入/退出全屏（移动端横屏全屏体验）
    (function () {
      const btn = document.getElementById("fsBtn");
      function isFs() { return document.fullscreenElement || document.webkitFullscreenElement; }
      function toggleFs() {
        const el = document.documentElement;
        if (!isFs()) {
          const req = el.requestFullscreen || el.webkitRequestFullscreen;
          if (req) req.call(el);
          // 尝试锁定为横屏（部分移动端支持）
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock("landscape").catch(() => {});
          }
        } else {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
        }
      }
      btn.addEventListener("click", toggleFs);
      document.addEventListener("fullscreenchange", () => {
        btn.textContent = isFs() ? "🗕" : "⛶";
      });
    })();
  </script>
  <script type="module" src="./src/main.js?v=20260807e"></script>
</body>
</html>
